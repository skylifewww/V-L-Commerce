services:
  - type: web
    name: tikflow-commerce
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tikflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

  - type: worker
    name: tikflow-celery
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tikflow-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tikflow-commerce
          envVarKey: SECRET_KEY
      - key: REDIS_URL
        fromService:
          type: redis
          name: tikflow-redis
          property: connectionString

  - type: redis
    name: tikflow-redis
    plan: free

databases:
  - name: tikflow-db
    databaseName: tikflow
    plan: free
